<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Risk Forge · Nzoia 3D</title>
    <meta name="description" content="Risk Forge: 3D river-flood exposure view of the Nzoia basin. JRC flood hazard, synthetic insurance portfolio, losses by return period." />
    <meta name="theme-color" content="#000418" />
    <script>
      // apply the saved theme (or the system preference) before the first paint, so there is no flash
      (function () {
        var t;
        try {
          t = localStorage.getItem("rf-theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t;
        if (t === "light") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#e9ecfb");
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/brand/mark.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cal+Sans&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
