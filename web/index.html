<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Risk Forge · Nzoia 3D</title>
    <meta name="description" content="Risk Forge: 3D river-flood exposure view of the Nzoia basin. JRC flood hazard, synthetic insurance portfolio, losses by return period." />
    <meta name="theme-color" content="#050b14" />
    <script>
      // apply the saved theme (or the system preference) before the first paint, so there is no flash
      (function () {
        var t;
        try {
          t = localStorage.getItem("rf-theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t;
        if (t === "light") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#e6ecf3");
      })();
    </script>
