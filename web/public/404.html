<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found · Risk Forge</title>
    <meta name="theme-color" content="#000418" />
    <link rel="icon" type="image/svg+xml" href="/brand/mark.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cal+Sans&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root { --bg: #000418; --text: #e2e8f0; --muted: #64748b; --soft: #94a3b8; --btn: #4f46e5; }
      @media (prefers-color-scheme: light) { :root { --bg: #e9ecfb; --text: #0f172a; --muted: #64748b; --soft: #475569; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; }
      main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px 16px; text-align: center; }
      img { width: 48px; height: 48px; }
      h1 { margin: 0; font-family: "Cal Sans", Inter, sans-serif; font-weight: 400; font-size: 28px; }
      p { margin: 0; color: var(--soft); font-size: 15px; max-width: 32ch; }
      .home { margin-top: 8px; padding: 10px 18px; border-radius: 12px; background: var(--btn); color: #fff; font-weight: 600; font-size: 14px; text-decoration: none; }
      footer { padding: 16px; text-align: center; font-size: 11px; color: var(--muted); }
      footer a { color: var(--soft); text-decoration: none; }
      footer a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/mark.svg" alt="" />
      <h1>Page not found</h1>
      <p>This page doesn't exist. The flood model lives on the home page.</p>
      <a class="home" href="/">Open Risk Forge</a>
    </main>
    <footer>Prototype · synthetic portfolio · <a href="https://rytrix.co.ke" target="_blank" rel="noopener">Built by Rytrix</a></footer>
  </body>
</html>
